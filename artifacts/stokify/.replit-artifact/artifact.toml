kind = "mobile"
previewPath = "/"
title = "shelflow"
version = "1.0.0"
id = "artifacts/stokify"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18950

[services.development]
run = "pnpm --filter @workspace/stokify run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stokify", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/stokify", "run", "serve" ]

[services.env]
PORT = "18950"
BASE_PATH = "/"
